name: Update wholesale prices

# Refreshes data/prices (AEMO 5-minute regional prices) for the Amber estimate used with NEM12 imports.
on:
  schedule:
    - cron: '17 15 * * *' # 1:17 am AEST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download AEMO prices
        run: node scripts/update-prices.js --refresh 2
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- data/prices)" ]; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices
          git commit -m "Update AEMO wholesale prices"
          git push
